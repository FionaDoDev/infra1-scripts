# /etc/sysctl.d/99-poste-admin.conf
# Rôle : Machine de l'administrateur principal du parc informatique (Zorin OS 18)
# Consigne 4 — paramètres noyau consolidés. Appliquer : sudo sysctl --system

# ZOR-01 [Sécurité] Masquer les adresses mémoire du noyau, même à root : complique l'exploitation d'une faille noyau (ANSSI-BP-028 (R9))
kernel.kptr_restrict = 2

# ZOR-02 [Sécurité] Réserver le journal du noyau aux administrateurs (ANSSI-BP-028 (R9))
kernel.dmesg_restrict = 1

# ZOR-03 [Sécurité] Seul un administrateur peut lire la mémoire d'un autre processus : protège les secrets chargés (coffre, agent SSH) (ANSSI-BP-028 (R11))
kernel.yama.ptrace_scope = 2

# ZOR-04 [Sécurité] Désactiver les combinaisons SysRq (redémarrage ou vidage mémoire au clavier) (ANSSI-BP-028 (R9))
kernel.sysrq = 0

# ZOR-05 [Sécurité] Interdire eBPF aux utilisateurs non privilégiés, source fréquente de failles noyau (ANSSI-BP-028 (R9))
kernel.unprivileged_bpf_disabled = 1

# ZOR-06 [Sécurité] Durcir le compilateur JIT eBPF (ANSSI-BP-028 (R9))
net.core.bpf_jit_harden = 2

# ZOR-07 [Sécurité] Empêcher le chargement d'un autre noyau à chaud (ANSSI-BP-028 (R9))
kernel.kexec_load_disabled = 1

# ZOR-08 [Sécurité] Limiter l'observation des performances, qui peut servir d'attaque par canal auxiliaire (ANSSI-BP-028 (R9))
kernel.perf_event_paranoid = 2

# ZOR-09 [Sécurité] Aucun vidage mémoire des programmes privilégiés : il pourrait contenir des mots de passe (ANSSI-BP-028 (R14))
fs.suid_dumpable = 0

# ZOR-10 [Sécurité] Bloquer les attaques par tubes nommés dans les dossiers partagés (/tmp) (ANSSI-BP-028 (R14))
fs.protected_fifos = 2

# ZOR-11 [Sécurité] Bloquer l'écriture piégée de fichiers dans les dossiers partagés (ANSSI-BP-028 (R14))
fs.protected_regular = 2

# ZOR-12 [Sécurité] Bloquer les attaques par liens symboliques et physiques (ANSSI-BP-028 (R14))
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# ZOR-13 [Sécurité] Empêcher l'injection de commandes dans le terminal d'un autre utilisateur (attaque visant su et sudo) (KSPP (Kernel Self Protection Project))
dev.tty.legacy_tiocsti = 0

# ZOR-14 [Sécurité] Refuser les redirections ICMP, qui peuvent détourner le trafic d'administration (ANSSI-BP-028 (R12))
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# ZOR-15 [Sécurité] Le poste n'est pas un routeur : il n'envoie pas de redirections (ANSSI-BP-028 (R12))
net.ipv4.conf.all.send_redirects = 0

# ZOR-16 [Sécurité] Rejeter les paquets à adresse source usurpée (ANSSI-BP-028 (R12))
net.ipv4.conf.all.rp_filter = 1

# ZOR-17 [Sécurité] Journaliser les paquets à adresse impossible : signe d'usurpation (CIS Ubuntu 24.04)
net.ipv4.conf.all.log_martians = 1

# ZOR-18 [Sécurité] Résister à une saturation par demandes de connexion (SYN flood) (ANSSI-BP-028 (R12))
net.ipv4.tcp_syncookies = 1

# ZOR-19 [Sécurité] Supprimer une pile réseau inutile (ANSSI-BP-028 (R13))
# net.ipv6.conf.all.disable_ipv6 = 1   # à activer seulement si IPv6 n'est pas utilisé
