# /etc/sysctl.d/99-hote-docker.conf
# Rôle : Machine exécutant 15 conteneurs Docker exposés sur Internet (Fedora 44)
# Consigne 4 — paramètres noyau consolidés. Appliquer : sudo sysctl --system

# Prérequis : le module br_netfilter doit être chargé (fichier /etc/modules-load.d/br_netfilter.conf contenant « br_netfilter »)

# FED-01 [Fonctionnel] Indispensable à Docker : les conteneurs sortent par NAT via l'hôte (Documentation Docker)
net.ipv4.ip_forward = 1

# FED-02 [Sécurité] Faire passer le trafic entre conteneurs par le filtrage du pare-feu (CIS Docker Benchmark)
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# FED-03 [Sécurité] Empêcher l'accès depuis le réseau aux services qui écoutent sur 127.0.0.1 (Bonnes pratiques Docker / Kubernetes)
net.ipv4.conf.all.route_localnet = 0

# FED-04 [Sécurité] Ni accepter ni envoyer de redirections ICMP (ANSSI-BP-028 (R12))
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# FED-05 [Sécurité] Rejeter les paquets à adresse source usurpée (ANSSI-BP-028 (R12))
net.ipv4.conf.all.rp_filter = 1

# FED-06 [Sécurité] Résister à une saturation par demandes de connexion depuis Internet (ANSSI-BP-028 (R12))
net.ipv4.tcp_syncookies = 1

# FED-07 [Performance] Table de suivi des connexions : pleine, elle fait rejeter du trafic (déni de service) (Documentation du noyau Linux (netfilter))
net.netfilter.nf_conntrack_max = 262144

# FED-08 [Performance] File d'attente des connexions du reverse proxy (Documentation NGINX (réglage des performances))
net.core.somaxconn = 4096

# FED-09 [Performance] File des connexions en cours d'ouverture, sous forte charge (Documentation NGINX (réglage des performances))
net.ipv4.tcp_max_syn_backlog = 4096

# FED-10 [Sécurité] Masquer les adresses mémoire du noyau : un conteneur compromis a moins d'informations pour s'échapper (ANSSI-BP-028 (R9))
kernel.kptr_restrict = 2

# FED-11 [Sécurité] Réserver le journal du noyau aux administrateurs (ANSSI-BP-028 (R9))
kernel.dmesg_restrict = 1

# FED-12 [Sécurité] Interdire eBPF non privilégié, voie d'évasion de conteneur connue (ANSSI-BP-028 (R9))
kernel.unprivileged_bpf_disabled = 1

# FED-13 [Sécurité] Durcir le compilateur JIT eBPF (ANSSI-BP-028 (R9))
net.core.bpf_jit_harden = 2

# FED-14 [Sécurité] Limiter la lecture de la mémoire des autres processus (ANSSI-BP-028 (R11))
kernel.yama.ptrace_scope = 2

# FED-15 [Sécurité] Aucun vidage mémoire des programmes privilégiés (ANSSI-BP-028 (R14))
fs.suid_dumpable = 0

# FED-16 [Fonctionnel] Nécessaire au remappage des utilisateurs Docker (userns-remap ou mode rootless) (CIS Docker Benchmark / ANSSI-FT-082)
user.max_user_namespaces = 15000

# FED-17 [Sécurité] Limiter le nombre total de processus : freine une explosion de processus dans un conteneur (ANSSI-BP-028 (R9))
kernel.pid_max = 65536

# FED-18 [Performance] Assez de surveillances de fichiers pour 15 conteneurs et les outils de supervision (Documentation du noyau Linux (inotify))
fs.inotify.max_user_instances = 512
