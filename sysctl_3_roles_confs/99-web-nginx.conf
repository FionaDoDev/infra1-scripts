# /etc/sysctl.d/99-web-nginx.conf
# Rôle : Machine hébergeant un serveur web nginx interne en HTTPS (Debian 13)
# Consigne 4 — paramètres noyau consolidés. Appliquer : sudo sysctl --system

# DEB-01 [Sécurité] Masquer les adresses mémoire du noyau (ANSSI-BP-028 (R9))
kernel.kptr_restrict = 2

# DEB-02 [Sécurité] Réserver le journal du noyau aux administrateurs (ANSSI-BP-028 (R9))
kernel.dmesg_restrict = 1

# DEB-03 [Sécurité] Empêcher un processus compromis (ex. nginx) de lire la mémoire d'un autre (ANSSI-BP-028 (R11))
kernel.yama.ptrace_scope = 2

# DEB-04 [Sécurité] Randomisation complète des adresses (ASLR) (ANSSI-BP-028 (R9))
kernel.randomize_va_space = 2

# DEB-05 [Sécurité] Désactiver les combinaisons SysRq (ANSSI-BP-028 (R9))
kernel.sysrq = 0

# DEB-06 [Sécurité] Interdire eBPF aux utilisateurs non privilégiés (ANSSI-BP-028 (R9))
kernel.unprivileged_bpf_disabled = 1

# DEB-07 [Sécurité] Aucun vidage mémoire des programmes privilégiés (clé privée TLS en mémoire) (ANSSI-BP-028 (R14))
fs.suid_dumpable = 0

# DEB-08 [Sécurité] Bloquer les attaques par fichiers piégés dans /tmp (ANSSI-BP-028 (R14))
fs.protected_regular = 2
fs.protected_fifos = 2

# DEB-09 [Sécurité] Le serveur web n'est pas un routeur (ANSSI-BP-028 (R12))
net.ipv4.ip_forward = 0

# DEB-10 [Sécurité] Ni accepter ni envoyer de redirections ICMP (ANSSI-BP-028 (R12))
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0

# DEB-11 [Sécurité] Refuser les paquets qui imposent leur propre itinéraire (ANSSI-BP-028 (R12))
net.ipv4.conf.all.accept_source_route = 0

# DEB-12 [Sécurité] Rejeter les paquets à adresse source usurpée (ANSSI-BP-028 (R12))
net.ipv4.conf.all.rp_filter = 1

# DEB-13 [Sécurité] Résister à une saturation par demandes de connexion (ANSSI-BP-028 (R12))
net.ipv4.tcp_syncookies = 1

# DEB-14 [Sécurité] Protéger les connexions en fin de vie contre une fermeture forcée (ANSSI-BP-028 (R12))
net.ipv4.tcp_rfc1337 = 1

# DEB-15 [Performance] File d'attente des connexions acceptées : évite les refus lors d'un pic de trafic (Documentation NGINX (réglage des performances))
net.core.somaxconn = 4096

# DEB-16 [Performance] File des connexions en cours d'ouverture (Documentation NGINX (réglage des performances))
net.ipv4.tcp_max_syn_backlog = 4096

# DEB-17 [Performance] Plus de ports sortants disponibles (utile si nginx sert de proxy) (ANSSI-BP-028 (R12))
net.ipv4.ip_local_port_range = 32768 65535

# DEB-18 [Performance] Garder le service en mémoire vive plutôt qu'en swap : temps de réponse stable (Documentation du noyau Linux (vm))
vm.swappiness = 10

# DEB-19 [Sécurité] Supprimer une pile réseau inutile (ANSSI-BP-028 (R13))
# net.ipv6.conf.all.disable_ipv6 = 1   # à activer seulement si IPv6 n'est pas utilisé
